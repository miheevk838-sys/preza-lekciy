<!-- ============================================================
     МОДУЛЬ РЕДАКТОРА И РИСОВАНИЯ
     Вставить целиком в конец страницы, после основного скрипта движка.
     Зависит только от наличия элементов .slide и .slide.active.
     Без внешних библиотек, без localStorage (пометки живут в памяти).
     Горячие клавиши:  D — рисовать,  E — править текст,
                       C — стереть пометки слайда,  [ ] — толщина,
                       1..5 — цвет пера.
     ============================================================ -->
<style>
  #drawbar{position:fixed; left:clamp(16px,4vw,40px); bottom:46px; z-index:30;
    display:flex; gap:6px; align-items:center; padding:6px 8px; border-radius:10px;
    background:rgba(20,20,30,.6); backdrop-filter:blur(6px);
    border:1px solid var(--hair-strong,rgba(255,255,255,.25)); font-family:var(--mono,monospace);
    opacity:.4; transition:opacity .2s;}
  #drawbar:hover{opacity:1;}
  #drawbar button{width:30px; height:30px; border-radius:7px; cursor:pointer;
    border:1px solid var(--hair,rgba(255,255,255,.15)); background:transparent;
    color:var(--wheat,#eee); font-size:.85rem; display:flex; align-items:center; justify-content:center;}
  #drawbar button.on{background:var(--terra,#d98); color:var(--void,#111); border-color:var(--terra,#d98);}
  #drawbar .sw{width:18px; height:18px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
  #drawbar .sw.on{border-color:var(--wheat,#fff);}
  #annotateCv{position:fixed; inset:0; z-index:25; pointer-events:none; touch-action:none;}
  #annotateCv.live{pointer-events:auto; cursor:crosshair;}
  .slide.editing .wrap{outline:1px dashed var(--terra,#d98); outline-offset:8px;}
</style>
<canvas id="annotateCv"></canvas>
<div id="drawbar">
  <button id="btnDraw" title="Рисовать (D)">✎</button>
  <button id="btnEdit" title="Править текст (E)">T</button>
  <span class="sw on" data-c="var(--terra)" style="background:var(--terra,#d98)"></span>
  <span class="sw" data-c="var(--cyan)" style="background:var(--cyan,#8ad)"></span>
  <span class="sw" data-c="var(--wheat)" style="background:var(--wheat,#eee)"></span>
  <span class="sw" data-c="#e54" style="background:#e54"></span>
  <button id="btnErase" title="Ластик">⌫</button>
  <button id="btnClear" title="Стереть слайд (C)">✕</button>
</div>
<script>
(function(){
  const cvs = document.getElementById('annotateCv');
  const ctx = cvs.getContext('2d');
  const allSlides = [...document.querySelectorAll('.slide')];
  const strokesBySlide = new Map();      // index -> [ {color,width,erase,pts:[{x,y}...]} ]  (x,y нормированы 0..1)
  let drawMode=false, editMode=false, erase=false, color='var(--terra)', width=3, drawing=false, cur0=0;

  function activeIndex(){ const a=document.querySelector('.slide.active'); return Math.max(0, allSlides.indexOf(a)); }
  function resize(){ const dpr=window.devicePixelRatio||1; cvs.width=innerWidth*dpr; cvs.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); redraw(); }
  function resolve(c){ if(!c.startsWith('var(')) return c; const name=c.slice(4,-1).trim(); return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#d98'; }
  function redraw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const list = strokesBySlide.get(activeIndex())||[];
    for(const s of list){
      ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle=resolve(s.color); ctx.lineWidth=s.width; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      s.pts.forEach((p,i)=>{ const x=p.x*innerWidth, y=p.y*innerHeight; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }
  // следим за сменой активного слайда
  new MutationObserver(()=>{ const i=activeIndex(); if(i!==cur0){ cur0=i; if(editMode) setEdit(false); redraw(); } })
    .observe(document.querySelector('.deck')||document.body, {subtree:true, attributes:true, attributeFilter:['class']});

  function setDraw(v){ drawMode=v; cvs.classList.toggle('live',v); document.getElementById('btnDraw').classList.toggle('on',v); if(v&&editMode) setEdit(false); }
  function setEdit(v){
    editMode=v; document.getElementById('btnEdit').classList.toggle('on',v);
    const a=document.querySelector('.slide.active'); if(!a) return;
    const wrap=a.querySelector('.wrap')||a; wrap.contentEditable = v?'true':'false'; a.classList.toggle('editing',v);
    if(v){ if(drawMode) setDraw(false); wrap.focus(); }
  }
  function pt(e){ const t=e.touches?e.touches[0]:e; return {x:t.clientX/innerWidth, y:t.clientY/innerHeight}; }
  function start(e){ if(!drawMode) return; e.preventDefault(); drawing=true;
    const list=strokesBySlide.get(activeIndex())||[]; list.push({color,width,erase,pts:[pt(e)]}); strokesBySlide.set(activeIndex(),list); }
  function move(e){ if(!drawMode||!drawing) return; e.preventDefault();
    const list=strokesBySlide.get(activeIndex()); list[list.length-1].pts.push(pt(e)); redraw(); }
  function end(){ drawing=false; }

  cvs.addEventListener('pointerdown',start); cvs.addEventListener('pointermove',move);
  addEventListener('pointerup',end); addEventListener('resize',resize);
  document.getElementById('btnDraw').onclick=()=>setDraw(!drawMode);
  document.getElementById('btnEdit').onclick=()=>setEdit(!editMode);
  document.getElementById('btnErase').onclick=function(){ erase=!erase; this.classList.toggle('on',erase); if(erase&&!drawMode) setDraw(true); };
  document.getElementById('btnClear').onclick=()=>{ strokesBySlide.set(activeIndex(),[]); redraw(); };
  [...document.querySelectorAll('#drawbar .sw')].forEach(sw=>sw.onclick=function(){
    document.querySelectorAll('#drawbar .sw').forEach(s=>s.classList.remove('on')); this.classList.add('on');
    color=this.dataset.c; erase=false; document.getElementById('btnErase').classList.remove('on'); if(!drawMode) setDraw(true);
  });
  addEventListener('keydown',e=>{
    if(e.target.isContentEditable) { if(e.key==='Escape') setEdit(false); return; }
    const k=e.key.toLowerCase();
    if(k==='d'){ setDraw(!drawMode); }
    else if(k==='e'){ setEdit(!editMode); }
    else if(k==='c'){ strokesBySlide.set(activeIndex(),[]); redraw(); }
    else if(k==='['){ width=Math.max(1,width-1); }
    else if(k===']'){ width=Math.min(24,width+1); }
    else if('12345'.includes(k)){ const sw=document.querySelectorAll('#drawbar .sw')[+k-1]; if(sw) sw.click(); }
  }, true);
  resize();
})();
</script>
