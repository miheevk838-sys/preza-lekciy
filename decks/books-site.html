<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книги · Персонажи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ДАННЫЕ ВЫНЕСЕНЫ В <script id="data"> ВНИЗУ.
   Сюда (в DATA) я буду вставлять твои книги и персонажей.
   ============================================================ */
:root{
  --bg-0:#120a22;        /* самый тёмный фон */
  --bg-1:#1a0f2e;
  --bg-2:#2d1b44;
  --acc:#8b5cf6;         /* основной сиреневый */
  --acc-2:#a855f7;
  --neon:#d946ef;        /* неон-маджента */
  --neon-2:#e879f9;
  --text:#e0d5f0;        /* лавандовый текст */
  --head:#f6f0ff;        /* почти белый заголовок */
  --glow:0 0 40px rgba(217,70,239,.45);
  --glass:rgba(255,255,255,.05);
  --line:rgba(224,213,240,.16);
  --t:480ms cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg-0);
  color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
a{color:inherit;text-decoration:none}

/* фоновое свечение/боке (общее для всех экранов) */
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmos .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.atmos .b1{width:50vmax;height:50vmax;left:-15vmax;top:-15vmax;background:radial-gradient(circle,var(--acc-2),transparent 65%)}
.atmos .b2{width:45vmax;height:45vmax;right:-12vmax;bottom:-12vmax;background:radial-gradient(circle,var(--neon),transparent 65%)}
#particles{position:absolute;inset:0}

/* экраны */
.screen{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity var(--t);}
.screen.active{opacity:1;visibility:visible}

/* ===== общий хром: верхнее меню, соцсети, скролл ===== */
.topbar{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;
  justify-content:space-between;padding:0 clamp(20px,4vw,56px);z-index:6;}
.brand{font-family:'Unbounded';font-weight:800;letter-spacing:.18em;font-size:14px;color:var(--head);text-transform:uppercase}
.brand span{color:var(--neon-2)}
.menu{display:flex;gap:clamp(18px,2.4vw,40px);font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.82}
.menu a{transition:color .25s;position:relative;padding:4px 0}
.menu a:hover,.menu a.on{color:var(--neon-2)}
.menu a.on::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--neon);box-shadow:var(--glow)}
.burger{display:flex;flex-direction:column;gap:5px}
.burger span{width:26px;height:2px;background:var(--text);display:block}

.rail-l{position:absolute;left:clamp(14px,2vw,30px);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:18px;align-items:center;z-index:6}
.rail-l a{font-size:11px;letter-spacing:.14em;opacity:.6;transition:.25s;writing-mode:vertical-rl}
.rail-l a:hover{opacity:1;color:var(--neon-2)}
.rail-l .scroll{margin-top:14px;font-size:10px;letter-spacing:.3em;writing-mode:vertical-rl;opacity:.45;text-transform:uppercase}
.rail-l .scroll::after{content:"";display:block;width:1px;height:46px;margin:8px auto 0;
  background:linear-gradient(var(--neon),transparent)}

/* кнопка-пилюля */
.pill{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;
  font-size:13px;letter-spacing:.06em;font-weight:600;color:var(--head);
  background:linear-gradient(120deg,var(--acc),var(--neon));
  box-shadow:var(--glow);transition:.3s;border:1px solid rgba(255,255,255,.18)}
.pill:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(217,70,239,.7)}
.pill.ghost{background:var(--glass);box-shadow:none;backdrop-filter:blur(10px)}
.pill.ghost:hover{border-color:var(--neon);box-shadow:var(--glow)}

/* =========================================================
   ЭКРАН 1 — ВЫБОР КНИГИ
   ========================================================= */
#booksScreen{display:flex;flex-direction:column}
.books-head{padding:96px clamp(28px,7vw,120px) 12px;z-index:2}
.kicker{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--neon-2);opacity:.9}
.books-head h1{font-family:'Unbounded';font-weight:900;color:var(--head);
  font-size:clamp(40px,7vw,92px);line-height:.95;margin-top:14px;text-shadow:0 0 50px rgba(168,85,247,.4)}
.books-head p{max-width:560px;margin-top:18px;opacity:.7;font-size:15px;line-height:1.6}

.books-row{flex:1;display:flex;gap:clamp(16px,2vw,30px);
  padding:24px clamp(28px,7vw,120px) 64px;overflow-x:auto;align-items:stretch;scrollbar-width:thin}
.books-row::-webkit-scrollbar{height:6px}
.books-row::-webkit-scrollbar-thumb{background:var(--acc);border-radius:3px}
.book-card{position:relative;flex:0 0 clamp(240px,26vw,330px);border-radius:22px;overflow:hidden;
  border:1px solid var(--line);background:var(--bg-1);cursor:pointer;transition:var(--t);
  box-shadow:0 20px 50px rgba(0,0,0,.5)}
.book-card:hover{transform:translateY(-10px);border-color:var(--neon);box-shadow:0 0 50px rgba(217,70,239,.45)}
.book-cover{aspect-ratio:3/4.2;background-size:cover;background-position:center;position:relative}
.book-cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg-1) 4%,transparent 55%)}
.book-meta{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 22px;z-index:2}
.book-meta h3{font-family:'Unbounded';font-weight:700;color:var(--head);font-size:21px;line-height:1.05}
.book-meta .tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--neon-2);margin-bottom:8px}
.book-meta .ann{font-size:12.5px;opacity:.72;margin-top:10px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book-go{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-size:12px;
  letter-spacing:.1em;color:var(--neon-2);text-transform:uppercase}

/* =========================================================
   ЭКРАН 2 — ПЕРСОНАЖИ КНИГИ (showcase)
   ========================================================= */
#charScreen{display:none}
#charScreen.active{display:block}
.stage{position:absolute;inset:0;z-index:1}
.stage-art{position:absolute;right:0;top:0;height:100%;width:62%;background-size:cover;
  background-position:top center;transition:opacity 600ms ease,transform 800ms ease;opacity:0;transform:scale(1.04)}
.stage-art.show{opacity:1;transform:scale(1)}
.stage-fade{position:absolute;inset:0;
  background:linear-gradient(90deg,var(--bg-0) 26%,rgba(18,10,34,.4) 52%,transparent 78%),
             linear-gradient(to top,var(--bg-0) 2%,transparent 30%)}

/* левая колонка — список персонажей */
.char-list{position:absolute;left:clamp(54px,7vw,110px);top:96px;bottom:40px;width:clamp(210px,20vw,260px);
  display:flex;flex-direction:column;gap:12px;overflow-y:auto;z-index:4;padding-right:6px;scrollbar-width:thin}
.char-list::-webkit-scrollbar{width:5px}
.char-list::-webkit-scrollbar-thumb{background:var(--acc);border-radius:3px}
.cl-item{display:flex;align-items:center;gap:14px;padding:10px;border-radius:16px;cursor:pointer;
  border:1px solid transparent;transition:.3s;background:var(--glass);backdrop-filter:blur(6px)}
.cl-item:hover{border-color:var(--line)}
.cl-item.on{border-color:var(--neon);box-shadow:var(--glow);background:rgba(217,70,239,.1)}
.cl-thumb{width:48px;height:60px;border-radius:11px;background-size:cover;background-position:center;
  flex:0 0 auto;border:1px solid var(--line)}
.cl-item.on .cl-thumb{width:58px;height:72px}
.cl-name{font-size:13px;font-weight:600;color:var(--head);letter-spacing:.02em;line-height:1.15}
.cl-role{font-size:11px;opacity:.6;margin-top:3px}

/* центр — имя-гигант + описание */
.char-main{position:absolute;left:clamp(54px,7vw,110px);top:0;bottom:0;
  display:flex;flex-direction:column;justify-content:center;
  width:min(620px,52vw);margin-left:clamp(230px,22vw,290px);z-index:3;pointer-events:none}
.char-main >*{pointer-events:auto}
.cm-role{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--neon-2);opacity:.95}
.cm-name{font-family:'Unbounded';font-weight:900;color:var(--head);text-transform:uppercase;
  font-size:clamp(48px,9vw,118px);line-height:.86;margin:14px 0 6px;
  text-shadow:0 0 60px rgba(168,85,247,.45);letter-spacing:-.01em}
.cm-sub{font-family:'Unbounded';font-weight:600;color:var(--neon-2);font-size:clamp(16px,2vw,24px);
  letter-spacing:.06em;opacity:.9;margin-bottom:22px}
.cm-desc{max-width:480px;font-size:15px;line-height:1.7;opacity:.82}
.cm-quote{margin-top:18px;padding-left:16px;border-left:2px solid var(--neon);font-style:italic;
  opacity:.85;font-size:15px;max-width:460px}
.cm-actions{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}

/* правая навигация по книгам/«регионам» */
.rail-r{position:absolute;right:0;top:0;bottom:0;width:46px;display:flex;flex-direction:column;
  z-index:6;border-left:1px solid var(--line);background:rgba(18,10,34,.35);backdrop-filter:blur(6px)}
.rail-r button{flex:1;writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  opacity:.55;transition:.3s;border-bottom:1px solid var(--line)}
.rail-r button:hover{opacity:1;color:var(--neon-2)}
.rail-r button.on{opacity:1;color:var(--head);background:linear-gradient(var(--acc),var(--neon));
  box-shadow:inset 0 0 30px rgba(217,70,239,.6)}

/* мини-плеер / подписка снизу */
.char-foot{position:absolute;left:clamp(54px,7vw,110px);bottom:34px;display:flex;align-items:center;gap:16px;z-index:4}
.play{width:50px;height:50px;border-radius:50%;border:2px solid var(--neon);display:grid;place-items:center;
  background:var(--glass);backdrop-filter:blur(8px);box-shadow:var(--glow);transition:.3s}
.play:hover{transform:scale(1.08)}
.play svg{width:18px;height:18px;fill:var(--neon-2);margin-left:2px}
.foot-txt .t1{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.foot-txt .t2{font-size:14px;color:var(--head);font-weight:600}

/* кнопка назад */
.back{position:absolute;top:86px;right:70px;z-index:7;display:flex;align-items:center;gap:8px;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;transition:.25s}
.back:hover{color:var(--neon-2);opacity:1}

/* подвал-подписка (общий, поверх обоих экранов снизу справа) */
.sub-fab{position:fixed;right:64px;bottom:30px;z-index:9}

@media(max-width:820px){
  .char-list{display:none}
  .char-main{margin-left:0;left:clamp(20px,6vw,40px);width:88vw}
  .stage-art{width:100%;opacity:.35!important}
  .rail-l{display:none}
  .menu{display:none}
}
</style>
</head>

          role:"Опись дома",
          sub:"Сёстры: одна не стареет, вторая идёт сквозь годы",
          art:"",
          artFallback:"radial-gradient(circle at 50% 32%,#a855f7,#2a1140 55%,#120a22 82%)",
          desc:"Дочери человека, который раз в неделю привозит в этот дом всё, что в нём едят. Когда одна из них, Клэр, умирала, отец сделал то, на что способен только отчаявшийся: отдал обеих туда, где смерти не боятся, потому что её победили. Кэлан спас Клэр единственным доступным ему способом — забрал у неё смерть вместе с теплом, сном и старением. А Блэр осталась по своей воле: куда сестра, туда и она. Теперь одна из них не стареет, а вторая идёт сквозь годы, как все люди, и обе знают, что однажды младшая останется носить лицо старшей ещё тысячу лет — одна. Клэр от этого холодна до льда. Блэр держится хуже. На новую любимицу дома она смотрит и видит всё, чего не досталось ей самой.",
          quote:""
        }
      ]
    }
  ]
};
</script>

<script>
/* ===================== ДВИЖОК ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

let curBook=0, curChar=0;

/* ---- частицы / боке ---- */
(function(){
  const c=$('#particles'),x=c.getContext('2d');let w,h,P=[];
  function rs(){w=c.width=innerWidth;h=c.height=innerHeight;}
  function mk(){P=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,
    r:Math.random()*1.8+.4,s:Math.random()*.3+.05,a:Math.random()*.5+.2}));}
  function loop(){x.clearRect(0,0,w,h);for(const p of P){p.y-=p.s;if(p.y<-5)p.y=h+5;
    x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(232,121,249,${p.a})`;x.fill();}
    requestAnimationFrame(loop);}
  rs();mk();loop();addEventListener('resize',()=>{rs();mk();});
})();

/* ---- рендер карточек книг ---- */
function renderBooks(){
  const row=$('#booksRow');row.innerHTML='';
  DATA.books.forEach((b,i)=>{
    const card=document.createElement('div');card.className='book-card';
    const cov=b.cover?`url('${b.cover}')`:b.coverFallback;
    card.innerHTML=`
      <div class="book-cover" style="background-image:${cov};background-color:#1a0f2e"></div>
      <div class="book-meta">
        <div class="tag">${b.tag||''}</div>
        <h3>${b.title}</h3>
        <div class="ann">${b.annotation||''}</div>
        <span class="book-go">Открыть мир →</span>
      </div>`;
    card.onclick=()=>openBook(i);
    row.appendChild(card);
  });
}

/* ---- правый рельс: список книг ---- */
function renderRail(){
  const r=$('#railR');r.innerHTML='';
  DATA.books.forEach((b,i)=>{
    const btn=document.createElement('button');
    btn.textContent=b.title;
    if(i===curBook)btn.classList.add('on');
    btn.onclick=()=>openBook(i);
    r.appendChild(btn);
  });
}

/* ---- открыть книгу ---- */
function openBook(i){
  curBook=i;curChar=0;
  const b=DATA.books[i];
  $('#charBrand').textContent=b.title.toUpperCase();
  $('#footTitle').textContent=b.title;
  $('#navLit').href=b.litnet||'#';
  renderRail();
  renderCharList();
  showChar(0);
  switchScreen('charScreen');
}

/* ---- список персонажей слева ---- */
function renderCharList(){
  const list=$('#charList');list.innerHTML='';
  const chars=DATA.books[curBook].characters||[];
  chars.forEach((c,i)=>{
    const it=document.createElement('div');it.className='cl-item'+(i===curChar?' on':'');
    const th=c.art?`url('${c.art}')`:c.artFallback;
    it.innerHTML=`<div class="cl-thumb" style="background-image:${th};background-color:#2d1b44"></div>
      <div><div class="cl-name">${c.name}</div><div class="cl-role">${c.role||''}</div></div>`;
    it.onclick=()=>showChar(i);
    list.appendChild(it);
  });
}

/* ---- показать персонажа ---- */
function showChar(i){
  curChar=i;
  const b=DATA.books[curBook],c=b.characters[i];
  const art=$('#stageArt');
  art.classList.remove('show');
  setTimeout(()=>{
    art.style.backgroundImage=c.art?`url('${c.art}')`:c.artFallback;
    art.classList.add('show');
  },120);
  $('#cmRole').textContent=c.role||'';
  $('#cmName').textContent=c.name||'';
  $('#cmSub').textContent=c.sub||'';
  $('#cmDesc').textContent=c.desc||'';
  $('#cmQuote').textContent=c.quote||'';
  $('#cmQuote').style.display=c.quote?'block':'none';
  $('#cmRead').href=b.litnet||'#';
  $('#cmSub2').href=b.subscribe||SUBSCRIBE_URL;
  $$('.cl-item').forEach((el,idx)=>el.classList.toggle('on',idx===i));
}

/* ---- переключение экранов ---- */
function switchScreen(id){
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
}

/* ---- навигация ---- */
$('#backBtn').onclick=()=>switchScreen('booksScreen');
$('#navBooks').onclick=e=>{e.preventDefault();switchScreen('booksScreen');};

/* ---- соцссылки / подписка ---- */
$('#subFab').href=SUBSCRIBE_URL;
$$('.rail-l a[data-soc]').forEach(a=>a.href=SOCIALS[a.dataset.soc]||'#');

/* init */
renderBooks();
</script>
</body>
</html>
